[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyquotex-core"
version = "1.0.0"
description = "PyQuotex Core API and dashboard backend"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110,<1",
  "uvicorn[standard]>=0.27,<1",
  "requests>=2.31,<3",
  "urllib3>=2.0,<3",
  "certifi>=2023.7.22",
  "websocket-client>=1.6,<2",
  "beautifulsoup4>=4.12,<5",
  "numpy>=1.24,<3",
  "pyfiglet>=0.8.post1",
]

[tool.setuptools.packages.find]
include = ["pyquotex*"]
